name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

# Least privilege by default; only the release job can write.
permissions:
  contents: read

jobs:
  build-backend:
    name: Build Backend (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: routerui-api-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: routerui-api-linux-aarch64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: |
          cd backend
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp backend/target/${{ matrix.target }}/release/routerui-api ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Create tarball
        run: |
          cd frontend
          tar -czvf ../routerui-frontend.tar.gz build/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: routerui-frontend
          path: routerui-frontend.tar.gz

  release:
    name: Create Release
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/routerui-api-linux-x86_64/routerui-api-linux-x86_64 release/
          cp artifacts/routerui-api-linux-aarch64/routerui-api-linux-aarch64 release/
          cp artifacts/routerui-frontend/routerui-frontend.tar.gz release/
          chmod +x release/routerui-api-*

      # The manual-run input goes through an environment variable, never
      # straight into the script, so it cannot inject shell commands.
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$'; then
            echo "::error::version must look like v1.2.3, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # GitHub's own CLI rather than a third-party action: this step holds a
      # write token and publishes the installer users pipe into a root shell.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Installation

          ```bash
          curl -sSL https://github.com/__REPO__/releases/download/__VERSION__/install.sh | sudo bash
          ```

          Or download and run manually:
          ```bash
          wget https://github.com/__REPO__/releases/download/__VERSION__/install.sh
          sudo bash install.sh
          ```

          ## What's Included
          - `routerui-api-linux-x86_64` - Backend binary for x86_64
          - `routerui-api-linux-aarch64` - Backend binary for ARM64
          - `routerui-frontend.tar.gz` - Pre-built frontend
          - `install.sh` - Installation script
          NOTES
          sed -i "s|__VERSION__|$VERSION|g; s|__REPO__|$GITHUB_REPOSITORY|g" release-notes.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "RouterUI $VERSION" --notes-file release-notes.md \
            release/routerui-api-linux-x86_64 \
            release/routerui-api-linux-aarch64 \
            release/routerui-frontend.tar.gz \
            install.sh
